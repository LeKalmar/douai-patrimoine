<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- Contrôle d'accès de l'espace pro -->
  <script>
    if (localStorage.getItem('rp_admin_auth') !== '1') window.location.replace('index.html');
  </script>
  <title>Magasins 2e/5e/6e étage — Réserve patrimoniale</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/columnar.js"></script>
  <style>
    /* Mise en page propre à cette page catalogue */
  </style>
  <!-- Publication en iframe -->
  <script src="js/parent-page-height.js"></script>
  <!-- Kit commun des outils pro : chargement du js SANS defer (utilisé par le script de page) -->
  <script src="js/admin-ui.js"></script>
  <script src="js/admin-charts.js"></script>
</head>
<body class="pro">

<header class="pro-head">
  <div class="pro-head__inner">
    <div class="pro-head__title">
      <p class="pro-crumb"><a href="admin.html">Espace professionnel</a> › Magasins</p>
      <h1 class="pro-head__h1">Magasins — 2e, 5e &amp; 6e étage</h1>
    </div>
    <div class="pro-head__actions">
      <a class="pro-btn pro-btn--ghost" href="admin.html">← Espace professionnel</a>
      <button type="button" class="pro-btn pro-btn--ghost" id="mg-logout">Déconnexion</button>
    </div>
  </div>
</header>

<main id="contenu" class="pro-main pro-wrap">

  <section class="pro-section">
    <div class="pro-kpis" id="mg-stats">
      <div class="pro-kpi pro-kpi--hero" aria-busy="true"><div class="pro-skeleton" style="height:3rem;width:50%;background:rgba(255,255,255,.2)"></div></div>
      <div class="pro-kpi" aria-busy="true"><div class="pro-skeleton" style="height:2rem;width:50%"></div></div>
      <div class="pro-kpi" aria-busy="true"><div class="pro-skeleton" style="height:2rem;width:50%"></div></div>
      <div class="pro-kpi" aria-busy="true"><div class="pro-skeleton" style="height:2rem;width:50%"></div></div>
      <div class="pro-kpi" aria-busy="true"><div class="pro-skeleton" style="height:2rem;width:50%"></div></div>
    </div>
  </section>

  <div class="pro-toolbar">
    <div class="pro-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-5-5"/></svg>
      <input type="text" id="mg-search-input" class="pro-input" placeholder="Rechercher un titre, un auteur, une cote, un code-barre…">
    </div>
    <select class="pro-input" id="mg-etage-select">
      <option value="">Tous les étages</option>
      <option value="2e">2e étage</option>
      <option value="5e">5e étage</option>
      <option value="6e">6e étage</option>
    </select>
    <select class="pro-input" id="mg-secteur-select">
      <option value="">Adulte + Jeunesse</option>
      <option value="Adulte">Adulte</option>
      <option value="Jeunesse">Jeunesse</option>
    </select>
    <select class="pro-input" id="mg-perpage">
      <option value="25">25 / page</option>
      <option value="50" selected>50 / page</option>
      <option value="100">100 / page</option>
      <option value="200">200 / page</option>
    </select>
    <span class="pro-muted" id="mg-count"></span>
  </div>

  <div class="pro-table-wrap">
    <table class="pro-table" aria-label="Catalogue des magasins">
      <thead>
        <tr>
          <th data-sort="cote" aria-sort="none"><button class="pro-sortbtn">Cote</button></th>
          <th data-sort="etage" aria-sort="none"><button class="pro-sortbtn">Étage</button></th>
          <th data-sort="secteur" aria-sort="none"><button class="pro-sortbtn">Secteur</button></th>
          <th data-sort="titre" aria-sort="none"><button class="pro-sortbtn">Titre</button></th>
          <th data-sort="auteur" aria-sort="none"><button class="pro-sortbtn">Auteur</button></th>
          <th data-sort="editeur" aria-sort="none"><button class="pro-sortbtn">Éditeur / Publié le</button></th>
          <th data-sort="barcode" aria-sort="none"><button class="pro-sortbtn">Code-barre</button></th>
        </tr>
      </thead>
      <tbody id="mg-tbody">
        <tr><td colspan="7" class="pro-empty">Chargement du catalogue…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pro-pager">
    <span class="pro-pager__info" id="pag-info"></span>
    <div class="pro-pager__nav" id="pag-controls"></div>
  </div>

</main>

<script>
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let ROWS = [];        // toutes les entrées, normalisées pour l'affichage/tri
let FILTERED = [];     // après recherche
let sortKey = 'cote';
let sortDir = 1;       // 1 asc, -1 desc
let page = 1;
let perPage = 50;

// Mêmes seuils que cotes-numeriques.html : chaque longueur de cote (5 ou 6
// chiffres) a sa propre séquence d'enregistrement, donc son propre seuil de
// bascule 2e/5e étage — réutilisés ici tels quels (même numérotation
// Syracuse). Un exemplaire sans run numérique (_coteDigitRun absent) est du
// 6e étage (cote littérale/Dewey — plus exclu depuis le passage à bib.xml,
// voir build-magasins.mjs).
const ETAGE_THRESHOLDS = { 5: 13830, 6: 133530 };
function etageOf(coteNum, digitRunLength) {
  if (!coteNum || !digitRunLength) return '6e';
  const threshold = ETAGE_THRESHOLDS[digitRunLength];
  if (!threshold) return '6e';
  return coteNum <= threshold ? '2e' : '5e';
}

function normalize(rec) {
  const g = rec['930$g'] || '';
  const h = rec['930$h'] || '';
  const i = rec['930$i'] || '';
  const cote = [g, h, i].filter(Boolean).join(' ');
  const digitRun = rec._coteDigitRun || '';
  const coteNum = parseInt(digitRun, 10) || 0;
  const etage = etageOf(coteNum, digitRun.length);
  const secteur = rec._secteur === 'Magasin Jeunesse' ? 'Jeunesse' : 'Adulte';
  const multi = s => (s || '').split('§').join(' / ');
  const titre = multi(rec['200$a']) || '(Sans titre)';
  const auteur = multi(rec['700$a']);
  const editeur = rec['210$c'] || '';
  const annee = rec['210$d'] || '';
  const barcode = rec['915$b'] || '';
  return { rec, cote, coteNum, etage, secteur, titre, auteur, editeur, annee, barcode };
}

const SORTERS = {
  // Un exemplaire sans cote (fréquent au 6e, cote non saisie dans Syracuse)
  // part en fin de liste au lieu d'occuper toute la première page.
  cote:    (a, b) => (!a.cote - !b.cote) || (a.coteNum - b.coteNum) || a.cote.localeCompare(b.cote),
  etage:   (a, b) => a.etage.localeCompare(b.etage) || (a.coteNum - b.coteNum),
  secteur: (a, b) => a.secteur.localeCompare(b.secteur),
  titre:   (a, b) => a.titre.localeCompare(b.titre),
  auteur:  (a, b) => a.auteur.localeCompare(b.auteur),
  editeur: (a, b) => (a.editeur + a.annee).localeCompare(b.editeur + b.annee),
  barcode: (a, b) => a.barcode.localeCompare(b.barcode),
};

function applySearch() {
  const q = (document.getElementById('mg-search-input').value || '').trim().toLowerCase();
  const etageFilter = document.getElementById('mg-etage-select').value;
  const secteurFilter = document.getElementById('mg-secteur-select').value;
  FILTERED = ROWS.filter(r =>
    (!etageFilter || r.etage === etageFilter) &&
    (!secteurFilter || r.secteur === secteurFilter) &&
    (!q ||
      r.titre.toLowerCase().includes(q) ||
      r.auteur.toLowerCase().includes(q) ||
      r.cote.toLowerCase().includes(q) ||
      r.barcode.toLowerCase().includes(q))
  );
}

function applySort() {
  const fn = SORTERS[sortKey] || SORTERS.cote;
  FILTERED = FILTERED.slice().sort((a, b) => sortDir * fn(a, b));
}

function render() {
  applySearch();
  applySort();

  const total = FILTERED.length;
  const totalPages = Math.max(1, Math.ceil(total / perPage));
  if (page > totalPages) page = totalPages;
  const start = (page - 1) * perPage;
  const pageRows = FILTERED.slice(start, start + perPage);

  document.getElementById('mg-count').textContent =
    total.toLocaleString('fr-FR') + ' notice' + (total > 1 ? 's' : '') +
    (total !== ROWS.length ? ' (sur ' + ROWS.length.toLocaleString('fr-FR') + ')' : '');

  const tbody = document.getElementById('mg-tbody');
  if (!pageRows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="padding:2rem;text-align:center;color:var(--pro-texte-doux)">Aucun résultat.</td></tr>';
  } else {
    tbody.innerHTML = pageRows.map(r => `
      <tr>
        <td class="pro-mono pro-cote-cell">${esc(r.cote)}</td>
        <td>${esc(r.etage)} étage</td>
        <td>${esc(r.secteur)}</td>
        <td title="${esc(r.titre)}">
          ${r.rec.lien_num ? `<a href="${esc(r.rec.lien_num)}" target="_blank" rel="noopener">${esc(r.titre)}</a>` : esc(r.titre)}
        </td>
        <td>${esc(r.auteur) || '—'}</td>
        <td>${esc([r.editeur, r.annee].filter(Boolean).join(', ')) || '—'}</td>
        <td class="pro-mono">${esc(r.barcode) || '—'}</td>
      </tr>
    `).join('');
  }

  renderPagination(total, totalPages);
  document.querySelectorAll('.pro-table th[aria-sort]').forEach(th => {
    const key = th.dataset.sort;
    if (key === sortKey) {
      th.setAttribute('aria-sort', sortDir === 1 ? 'ascending' : 'descending');
    } else {
      th.setAttribute('aria-sort', 'none');
    }
  });
}

function renderPagination(total, totalPages) {
  document.getElementById('pag-info').textContent =
    total ? `Page ${page} / ${totalPages}` : '';

  const controls = document.getElementById('pag-controls');
  const btn = (label, target, disabled, active) =>
    `<button class="pro-btn pro-btn--sm ${active ? '' : 'pro-btn--ghost'}" data-page="${target}" ${disabled ? 'disabled' : ''}>${label}</button>`;

  let html = btn('‹ Précédent', page - 1, page === 1, false) + btn('Suivant ›', page + 1, page === totalPages, false);
  controls.innerHTML = html;

  controls.querySelectorAll('.pro-btn').forEach(b => {
    b.addEventListener('click', () => {
      page = parseInt(b.dataset.page, 10);
      render();
    });
  });
}

document.getElementById('mg-search-input').addEventListener('input', () => { page = 1; render(); });
document.getElementById('mg-etage-select').addEventListener('change', () => { page = 1; render(); });
document.getElementById('mg-secteur-select').addEventListener('change', () => { page = 1; render(); });
document.getElementById('mg-perpage').addEventListener('change', (e) => {
  perPage = parseInt(e.target.value, 10);
  page = 1;
  render();
});
document.getElementById('mg-logout').addEventListener('click', () => {
  localStorage.removeItem('rp_admin_auth');
  localStorage.removeItem('rp_admin_token');
  window.location.href = 'index.html';
});
document.querySelectorAll('.pro-table th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    render();
  });
});

let latestReport = null;
let rowsLoaded = false;

function renderStats() {
  if (!rowsLoaded || !latestReport) return;
  const s = latestReport.stats || {};
  const date = latestReport.generatedAt ? rpUI.fmt.date(latestReport.generatedAt) + ' <span class="pro-muted" style="font-family:var(--pro-font-body);font-size:.78rem;font-weight:400">· ' + rpUI.fmt.ago(latestReport.generatedAt) + '</span>' : '—';
  const etage2 = ROWS.filter(r => r.etage === '2e').length;
  const etage5 = ROWS.filter(r => r.etage === '5e').length;
  const etage6 = ROWS.filter(r => r.etage === '6e').length;
  const total = (s.kept ?? 0);
  document.getElementById('mg-stats').innerHTML = `
    <div class="pro-kpi pro-kpi--hero">
      <div class="pro-kpi__label">Total magasins</div>
      <div class="pro-kpi__value">${rpUI.fmt.n(total)}</div>
    </div>
    <div class="pro-kpi">
      <div class="pro-kpi__label">2e étage</div>
      <div class="pro-kpi__value">${rpUI.fmt.n(etage2)}</div>
    </div>
    <div class="pro-kpi">
      <div class="pro-kpi__label">5e étage</div>
      <div class="pro-kpi__value">${rpUI.fmt.n(etage5)}</div>
    </div>
    <div class="pro-kpi">
      <div class="pro-kpi__label">6e étage</div>
      <div class="pro-kpi__value">${rpUI.fmt.n(etage6)}</div>
    </div>
    <div class="pro-kpi">
      <div class="pro-kpi__label">Export du</div>
      <div class="pro-kpi__value" style="font-size:1.1rem">${date}</div>
    </div>
  `;
}

fetch('data/magasins.json')
  .then(res => res.json())
  .then(data => {
    // Depuis 2026-08-26, data/magasins.json couvre toute la bibliothèque de
    // Douai (voir build-magasins.mjs) pour permettre à recolement.html de
    // reconnaître n'importe quel code-barre et détecter les anomalies de
    // classement — cette page-ci reste un catalogue des seuls magasins,
    // d'où ce filtre côté client. `!== false` (plutôt que truthy strict) :
    // un ancien data/magasins.json généré avant l'ajout de ce flag n'a pas
    // du tout de champ _isMagasin, mais ne contenait déjà que des magasins.
    // forEachRow plutôt qu'un filter().map() : data/magasins.json est un
    // conteneur colonnaire depuis 2026-09-02 (voir js/columnar.js), et le
    // parcourir ligne à ligne évite de matérialiser les 199 583 objets bruts
    // pour n'en garder ensuite que les ~88 000 de magasin.
    ROWS = [];
    columnar.forEachRow(data, rec => { if (rec._isMagasin !== false) ROWS.push(normalize(rec)); });
    FILTERED = ROWS;
    rowsLoaded = true;
    render();
    renderStats();
  })
  .catch(err => {
    document.getElementById('mg-tbody').innerHTML =
      '<tr><td colspan="7" class="mg-empty">Impossible de charger data/magasins.json — lancez `npm run build:magasins`.</td></tr>';
    console.error(err);
  });

fetch('data/magasins-build-report.json')
  .then(res => res.json())
  .then(report => { latestReport = report; })
  .catch(() => { latestReport = { stats: {} }; })
  .then(renderStats);
</script>

</body>
</html>
