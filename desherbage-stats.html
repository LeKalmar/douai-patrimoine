<script>
(function () {
'use strict';

const ui = window.rpUI, charts = window.rpCharts, fmt = ui.fmt, esc = ui.esc;
const $ = id => document.getElementById(id);
const fn = (v, d) => fmt.n(v, d);                       // 1234 → « 1 234 »
const COLL = new Intl.Collator('fr', { numeric: true, sensitivity: 'base' });
const BLEU = '#2A3CD4', BLEU_CLAIR = '#8F9BE6', CARMIN = '#B4213C', GRIS = '#9A9AA8';

/* ═══ Déconnexion ═════════════════════════════════════════════════════ */
$('admin-logout').addEventListener('click', () => {
  localStorage.removeItem('rp_admin_auth');
  localStorage.removeItem('rp_admin_token');
  window.location.href = 'index.html';
});

/* ═══ État ════════════════════════════════════════════════════════════ */
let N = 0, REF = new Date().getFullYear(), BUILT_AT = null;
// Colonnes de données (struct-of-arrays : 291 015 lignes sans 291 015 objets).
let TITRE, AUTEUR, COTE, BC, PIEGE;                    // chaînes
let SEC_I, FONDS_I;                                      // indices de dictionnaire
let AN, AN1, AN2, AN3, CUM, RESA, RAN, RAN1, RAN2, RAN3, DERN, YEAR, MAG, ETAGE, P4;
const SECS = [], FONDS = [], SEC_MAP = new Map(), FONDS_MAP = new Map();
let scope = 'all';
let activeTab = 'overview';
const AGG = {};                // scope → agrégats, calculés une seule fois
const dirty = { overview: true, sections: true, dormants: true, exemplaires: true };
let dormPreset = null;

const SCOPE_LABEL = { all: 'toute la bibliothèque', mag: 'les magasins', hors: 'hors magasins' };

/* Étage 2e/5e/6e d'un exemplaire de magasin, à partir de son coteDigitRun —
   mêmes seuils que recolement.html/magasins.html (voir CLAUDE.md « Cotes
   numériques »). Dupliqué volontairement : pas de module partagé entre pages
   statiques dans ce projet. */
const ETAGE_THRESHOLDS = { 5: 13830, 6: 133530 };
function etageCode(run) {                                // 1 = 2e, 2 = 5e, 3 = 6e
  if (!run) return 3;
  const th = ETAGE_THRESHOLDS[run.length];
  if (!th) return 3;
  return (parseInt(run, 10) || 0) <= th ? 1 : 2;
}
const ETAGE_LABELS = ['', 'Magasin — 2e étage', 'Magasin — 5e étage', 'Magasin — 6e étage'];

function dictIndex(map, list, label) {
  let k = map.get(label);
  if (k === undefined) { k = list.length; list.push(label); map.set(label, k); }
  return k;
}

function extract(data) {
  N = columnar.rowCount(data);
  TITRE = new Array(N); AUTEUR = new Array(N); COTE = new Array(N); BC = new Array(N); PIEGE = new Array(N);
  SEC_I = new Uint16Array(N); FONDS_I = new Uint16Array(N);
  AN = new Int32Array(N); AN1 = new Int32Array(N); AN2 = new Int32Array(N); AN3 = new Int32Array(N);
  CUM = new Int32Array(N); RESA = new Int32Array(N);
  RAN = new Int32Array(N); RAN1 = new Int32Array(N); RAN2 = new Int32Array(N); RAN3 = new Int32Array(N);
  DERN = new Uint16Array(N); YEAR = new Uint16Array(N); MAG = new Uint8Array(N); ETAGE = new Uint8Array(N);
  P4 = new Int32Array(N);
  columnar.forEachRow(data, (rec, i) => {
    const noms = (rec['700$a'] || '').split('§').map(s => s.trim()).filter(Boolean);
    const prenoms = (rec['700$b'] || '').split('§').map(s => s.trim());
    AUTEUR[i] = noms.length
      ? noms.map((n, k) => (n.toUpperCase() + (prenoms[k] ? ' ' + prenoms[k] : '')).trim()).join(', ')
      : (rec['700$a'] || '');
    TITRE[i] = rec['200$a'] || '(titre inconnu)';
    COTE[i] = rec.coteAffichee || '';
    BC[i] = rec._barcode || '';
    PIEGE[i] = rec._piege || '';
    SEC_I[i] = dictIndex(SEC_MAP, SECS, rec.section || '(sans section)');
    FONDS_I[i] = dictIndex(FONDS_MAP, FONDS, rec._fondsLabel || rec.section || '');
    const p = rec.prets || {}, r = rec.reservations || {};
    AN[i] = p.an || 0; AN1[i] = p.an1 || 0; AN2[i] = p.an2 || 0; AN3[i] = p.an3 || 0; CUM[i] = p.cumules || 0;
    P4[i] = AN[i] + AN1[i] + AN2[i] + AN3[i];
    RAN[i] = r.an || 0; RAN1[i] = r.an1 || 0; RAN2[i] = r.an2 || 0; RAN3[i] = r.an3 || 0; RESA[i] = r.cumulees || 0;
    DERN[i] = parseInt(rec.derniereAnneePret, 10) || 0;
    const ds = rec.dateSaisie;                           // JJ/MM/AAAA
    YEAR[i] = ds && ds.length >= 10 ? (parseInt(ds.slice(6, 10), 10) || 0) : 0;
    if (rec._isMagasin) { MAG[i] = 1; ETAGE[i] = etageCode(rec._coteDigitRun); }
  });
}

/* ═══ Agrégats : une seule passe par périmètre, mis en cache ═══════════ */
const LAST_MIN = 2007;                                    // « 2007 ou avant »
const DEC_LABELS = ['Avant 1990', '1990s', '2000s', '2010s', '2020s'];
const BUCKETS = [
  { label: '0', test: v => v === 0 }, { label: '1', test: v => v === 1 }, { label: '2', test: v => v === 2 },
  { label: '3', test: v => v === 3 }, { label: '4', test: v => v === 4 },
  { label: '5–9', test: v => v >= 5 && v <= 9 }, { label: '10+', test: v => v >= 10 }
];
function bucketOf(v) { return v < 5 ? v : (v < 10 ? 5 : 6); }

function agg(sc) {
  if (AGG[sc]) return AGG[sc];
  const label = 'agrégats « ' + sc + ' »';
  console.time(label);
  const nSec = SECS.length, lastN = Math.max(REF, LAST_MIN) - LAST_MIN + 2;   // 0 = jamais, 1 = 2007 ou avant, …
  let maxCum = 0;
  for (let i = 0; i < N; i++) if (CUM[i] > maxCum) maxCum = CUM[i];
  const a = {
    scope: sc, count: 0, prets: [0, 0, 0, 0], resa: [0, 0, 0, 0], resaCum: 0, cumSum: 0, p4: 0,
    never: 0, ever4: 0, dorm: 0, dormNever: 0, dormSansPiege: 0, top: -1, topCum: -1, mag: 0,
    buckets: new Int32Array(7), last: new Int32Array(lastN), dormLast: new Int32Array(lastN),
    decTot: new Int32Array(5), decNever: new Int32Array(5), noDate: 0, noDateNever: 0,
    cumHist: new Int32Array(maxCum + 1),
    secCount: new Int32Array(nSec), secAn: new Float64Array(nSec), secP4: new Float64Array(nSec),
    secCum: new Float64Array(nSec), secNever: new Int32Array(nSec),
    etCount: new Int32Array(4), etAn: new Float64Array(4), etP4: new Float64Array(4),
    etCum: new Float64Array(4), etNever: new Int32Array(4)
  };
  for (let i = 0; i < N; i++) {
    const m = MAG[i];
    if (sc === 'mag' ? !m : (sc === 'hors' && m)) continue;
    a.count++;
    if (m) a.mag++;
    const cum = CUM[i], p4 = P4[i];
    a.prets[0] += AN3[i]; a.prets[1] += AN2[i]; a.prets[2] += AN1[i]; a.prets[3] += AN[i];
    a.resa[0] += RAN3[i]; a.resa[1] += RAN2[i]; a.resa[2] += RAN1[i]; a.resa[3] += RAN[i];
    a.resaCum += RESA[i];
    a.p4 += p4; a.cumSum += cum;
    if (cum === 0) a.never++;
    if (p4 > 0) a.ever4++;
    if (cum > a.topCum) { a.topCum = cum; a.top = i; }
    a.buckets[bucketOf(cum)]++;
    a.cumHist[cum]++;
    const d = DERN[i], li = d ? Math.min(lastN - 1, Math.max(1, d - LAST_MIN + 1)) : 0;
    a.last[li]++;
    if (p4 === 0) {
      a.dorm++;
      a.dormLast[li]++;
      if (cum === 0) a.dormNever++;
      if (!PIEGE[i]) a.dormSansPiege++;
    }
    const y = YEAR[i];
    if (y) {
      const di = y < 1990 ? 0 : Math.min(4, Math.floor((y - 1990) / 10) + 1);
      a.decTot[di]++;
      if (cum === 0) a.decNever[di]++;
    } else { a.noDate++; if (cum === 0) a.noDateNever++; }
    const s = SEC_I[i];
    a.secCount[s]++; a.secAn[s] += AN[i]; a.secP4[s] += p4; a.secCum[s] += cum;
    if (cum === 0) a.secNever[s]++;
    if (m) {
      const e = ETAGE[i];
      a.etCount[e]++; a.etAn[e] += AN[i]; a.etP4[e] += p4; a.etCum[e] += cum;
      if (cum === 0) a.etNever[e]++;
    }
  }
  console.timeEnd(label);
  return (AGG[sc] = a);
}

/* ═══ Vue d'ensemble ══════════════════════════════════════════════════ */
function shareOfTop(a, frac) {                           // part des prêts des `frac` exemplaires les plus empruntés
  if (!a.cumSum) return 0;
  const need = frac * a.count;
  let acc = 0, sum = 0;
  for (let v = a.cumHist.length - 1; v >= 0 && acc < need; v--) {
    const c = a.cumHist[v];
    if (!c) continue;
    const take = Math.min(c, need - acc);
    sum += take * v; acc += take;
  }
  return sum / a.cumSum;
}
function topFractionFor(a, share) {                      // plus petite part d'exemplaires qui fait `share` des prêts
  if (!a.cumSum) return 0;
  const target = share * a.cumSum;
  let acc = 0, sum = 0;
  for (let v = a.cumHist.length - 1; v > 0; v--) {
    const c = a.cumHist[v];
    if (!c) continue;
    if (sum + c * v >= target) return (acc + Math.ceil((target - sum) / v)) / a.count;
    sum += c * v; acc += c;
  }
  return 1;
}
function lorenzValues(a) {                               // valeurs triées du moins au plus emprunté, via l'histogramme
  const out = new Array(a.count);
  let k = 0;
  for (let v = 0; v < a.cumHist.length; v++) for (let c = a.cumHist[v]; c > 0; c--) out[k++] = v;
  return out;
}

/* ═══ Sections ════════════════════════════════════════════════════════ */
const secTab = { sortKey: 'rotation', dir: 1, q: '' };
const SEC_COLS = [
  { key: 'section', label: 'Section' }, { key: 'count', label: 'Exemplaires', num: true },
  { key: 'prets4', label: 'Prêts (4 ans)', num: true }, { key: 'moyenne', label: 'Moy. / ex.', num: true },
  { key: 'cumules', label: 'Cumulés', num: true }, { key: 'jamais', label: 'Jamais empr.', num: true },
  { key: 'rotation', label: 'Taux de rotation', num: true }
];
function sectionEntries(a) {
  const out = [];
  for (let s = 0; s < SECS.length; s++) {
    const c = a.secCount[s];
    if (!c) continue;
    out.push({ idx: s, section: SECS[s], count: c, prets4: a.secP4[s], moyenne: a.secP4[s] / c, cumules: a.secCum[s], jamais: a.secNever[s], jamaisPct: a.secNever[s] / c, rotation: a.secAn[s] / c });
  }
  return out;
}
const median = arr => { if (!arr.length) return 0; const s = arr.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const MIN_SEC = 100;                                       // sections retenues pour le classement et la médiane

function sortSecRows(rows) {
  const k = secTab.sortKey, d = secTab.dir;
  return rows.slice().sort((x, y) => d * (k === 'section' ? COLL.compare(x.section, y.section) : x[k] - y[k]));
}
function sectionTableHtml(rows, firstLabel) {
  const head = '<tr>' + SEC_COLS.map(c => {
    const lab = c.key === 'section' ? firstLabel : c.label;
    return '<th scope="col" class="' + (c.num ? 'is-num' : '') + '" aria-sort="' + (secTab.sortKey === c.key ? (secTab.dir === 1 ? 'ascending' : 'descending') : 'none') + '" data-sec-sort="' + c.key + '"><button type="button" class="pro-sortbtn">' + esc(lab) + '</button></th>';
  }).join('') + '</tr>';
  const body = rows.length ? rows.map(e => '<tr><td>' + esc(e.section) + '</td><td class="is-num">' + fn(e.count) + '</td><td class="is-num">' + fn(e.prets4) + '</td><td class="is-num">' + fn(e.moyenne, 2) + '</td><td class="is-num">' + fn(e.cumules) + '</td>' +
    '<td class="is-num">' + fn(e.jamais) + ' <span class="dst-meta">(' + fmt.pct(e.jamaisPct) + ')</span></td><td class="is-num"><strong style="color:var(--pro-bleu)">' + rate(e.rotation) + '</strong></td></tr>').join('')
    : '<tr><td colspan="7"><div class="pro-empty">Aucun résultat.</div></td></tr>';
  return '<table class="pro-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}

  const all = sectionEntries(a);
  const big = all.filter(e => e.count >= MIN_SEC);
  const med = median(big.map(e => e.rotation));
  const chartRows = big.slice().sort((x, y) => y.rotation - x.rotation);
  const shown = chartRows.slice().sort((x, y) => y.count - x.count).slice(0, 20).sort((x, y) => y.rotation - x.rotation);

  h += '<div class="pro-card pro-card--pad"><div class="dst-head-row"><div><p class="pro-label pro-card__label">Par section</p><h2 class="pro-card__title">Rotation par section</h2>' +

/* ═══ Tri, filtre et pagination des deux grands tableaux ══════════════ */
const ORDER = {};                                           // clé → indices triés (croissant), sur TOUTES les lignes
const STR_COLS = { titre: () => TITRE, auteur: () => AUTEUR, cote: () => COTE, barcode: () => BC, piege: () => PIEGE };
const NUM_COLS = { an3: () => AN3, an2: () => AN2, an1: () => AN1, an: () => AN, cum: () => CUM, resa: () => RESA, p4: () => P4, dern: () => DERN };
function getOrder(key) {
  if (ORDER[key]) return ORDER[key];
  const t0 = performance.now();
  const idx = new Int32Array(N);
  for (let i = 0; i < N; i++) idx[i] = i;
  if (STR_COLS[key]) { const A = STR_COLS[key](); idx.sort((x, y) => COLL.compare(A[x], A[y]) || x - y); }
  else if (key === 'fonds') {                                 // dictionnaire réduit à des rangs : un seul tri de ~70 libellés
    const rank = new Int32Array(FONDS.length);
    FONDS.map((l, i) => i).sort((x, y) => COLL.compare(FONDS[x], FONDS[y])).forEach((fi, r) => { rank[fi] = r; });
    idx.sort((x, y) => rank[FONDS_I[x]] - rank[FONDS_I[y]] || x - y);
  } else { const A = NUM_COLS[key](); idx.sort((x, y) => A[x] - A[y] || x - y); }
  console.log('tri « ' + key + ' » : ' + Math.round(performance.now() - t0) + ' ms');
  return (ORDER[key] = idx);
}

let HAY = null;                                              // texte de recherche en minuscules sans accents, construit à la première recherche
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function buildHay() {
  const t0 = performance.now();
  HAY = new Array(N);
  for (let i = 0; i < N; i++) HAY[i] = norm(TITRE[i] + '\n' + AUTEUR[i] + '\n' + COTE[i] + '\n' + FONDS[FONDS_I[i]] + '\n' + BC[i]);
  console.log('index de recherche : ' + Math.round(performance.now() - t0) + ' ms');
}

/* Pagination commune aux deux tableaux. */
function pagerHtml(page, pages, total, perPage) {
  const from = total ? (page - 1) * perPage + 1 : 0, to = Math.min(total, page * perPage);
  let nav = '';
  const btn = (label, target, o) => '<button type="button" class="pro-btn pro-btn--secondary' + '" data-page="' + target + '"' + (o && o.disabled ? ' disabled' : '') + (o && o.current ? ' aria-current="page"' : '') + (o && o.aria ? ' aria-label="' + o.aria + '"' : '') + '>' + label + '</button>';
  nav += btn('«', 1, { disabled: page === 1, aria: 'Première page' }) + btn('‹', page - 1, { disabled: page === 1, aria: 'Page précédente' });
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - page) <= 1) nav += btn(fn(p), p, { current: p === page });
    else if (Math.abs(p - page) === 2) nav += '<span class="pro-pager__gap" aria-hidden="true">…</span>';
  }
  nav += btn('›', page + 1, { disabled: page === pages, aria: 'Page suivante' }) + btn('»', pages, { disabled: page === pages, aria: 'Dernière page' });
  return '<span class="pro-pager__info">' + (total ? fn(from) + '–' + fn(to) + ' sur ' + fn(total) + ' · page ' + fn(page) + ' / ' + fn(pages) : 'Aucun résultat') + '</span><nav class="pro-pager__nav" aria-label="Pagination">' + nav + '</nav>';
}

function createTable(cfg) {
  const t = { sortKey: cfg.sortKey, dir: cfg.dir, page: 1, perPage: 50, q: '', view: null, sig: '' };
  const head = $(cfg.id + '-head'), body = $(cfg.id + '-body'), pager = $(cfg.id + '-pager'), count = $(cfg.id + '-count');
  head.innerHTML = cfg.cols.map(c => '<th scope="col" class="' + (c.num ? 'is-num' : '') + '"' + (c.sort ? ' aria-sort="none" data-sort="' + c.sort + '"' : '') + '>' +
    (c.sort ? '<button type="button" class="pro-sortbtn">' + c.label + '</button>' : c.label) + '</th>').join('');
  function compute() {
    const q = norm(t.q.trim());
    const sig = [scope, t.sortKey, t.dir, q, cfg.extraSig ? cfg.extraSig() : ''].join('|');
    if (sig === t.sig && t.view) return t.view;
    if (q && !HAY) buildHay();
    const order = getOrder(t.sortKey), out = new Int32Array(N), asc = t.dir === 1;
    let k = 0;
    for (let j = 0; j < N; j++) {
      const i = asc ? order[j] : order[N - 1 - j];
      if (!inScope(i) || (cfg.pred && !cfg.pred(i))) continue;
      if (q && HAY[i].indexOf(q) < 0) continue;
      out[k++] = i;
    }
    t.sig = sig;
    return (t.view = out.subarray(0, k));
  }
  function render() {
    const view = compute(), total = view.length;
    const pages = Math.max(1, Math.ceil(total / t.perPage));
    if (t.page > pages) t.page = pages;
    const start = (t.page - 1) * t.perPage, end = Math.min(total, start + t.perPage);
    let h = '';
    for (let j = start; j < end; j++) h += cfg.row(view[j]);
    body.innerHTML = h || '<tr><td colspan="' + cfg.cols.length + '"><div class="pro-empty">Aucun résultat.</div></td></tr>';
    const inS = scopeTotal();
    count.textContent = fn(total) + ' exemplaire' + (total > 1 ? 's' : '') + (cfg.universe ? (total !== cfg.universe() ? ' (sur ' + fn(cfg.universe()) + ')' : '') : (total !== inS ? ' (sur ' + fn(inS) + ')' : ''));
    pager.innerHTML = pagerHtml(t.page, pages, total, t.perPage);
    head.querySelectorAll('th[data-sort]').forEach(th => {
      th.setAttribute('aria-sort', th.dataset.sort === t.sortKey ? (t.dir === 1 ? 'ascending' : 'descending') : 'none');
    });
    if (cfg.after) cfg.after(view);
  }
  head.addEventListener('click', e => {
    const th = e.target.closest('th[data-sort]');
    if (!th) return;
    const k = th.dataset.sort;
    if (t.sortKey === k) t.dir *= -1; else { t.sortKey = k; t.dir = (k === 'titre' || k === 'auteur' || k === 'cote' || k === 'fonds' || k === 'barcode' || k === 'piege') ? 1 : -1; }
    t.page = 1;
    const slow = !ORDER[k];
    if (slow) { count.textContent = 'Tri en cours…'; setTimeout(render, 30); } else render();
  });
  pager.addEventListener('click', e => {
    const b = e.target.closest('button[data-page]');
    if (!b || b.disabled) return;
    t.page = parseInt(b.dataset.page, 10);
    render();
  });
  $(cfg.id + '-perpage').addEventListener('change', e => { t.perPage = parseInt(e.target.value, 10); t.page = 1; render(); });
  let timer = null;
  $(cfg.id + '-q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { t.q = e.target.value; t.page = 1; render(); }, 220); });
  t.render = render;
  t.reset = () => { t.sig = ''; t.view = null; t.page = 1; };
  t.current = compute;
  return t;
}
const scopeTotal = () => agg(scope).count;

/* ═══ Onglet « Dormants » ═════════════════════════════════════════════ */
let dormTable = null;
const dormState = { hist: 'all', piege: 'all' };
function buildDormTable() {
  dormTable = createTable({
    id: 'dorm', sortKey: 'cum', dir: -1,
    cols: [
      { label: 'Titre', sort: 'titre' }, { label: 'Auteur', sort: 'auteur' }, { label: 'Cote', sort: 'cote' }, { label: 'Section / magasin', sort: 'fonds' },
      { label: 'Prêts cumulés', sort: 'cum', num: true }, { label: 'Dernier prêt', sort: 'dern' }, { label: 'Piège', sort: 'piege' }, { label: 'Code-barre', sort: 'barcode' }
    ],
    pred: i => {
      if (P4[i] !== 0) return false;
      if (dormState.hist === 'never' && CUM[i] !== 0) return false;
      if (dormState.hist === 'past' && CUM[i] === 0) return false;
      if (dormState.piege === 'no' && PIEGE[i]) return false;
      if (dormState.piege === 'yes' && !PIEGE[i]) return false;
      return true;
    },
    extraSig: () => dormState.hist + dormState.piege,
    universe: () => agg(scope).dorm,
    row: i => '<tr><td class="dst-titre">' + esc(TITRE[i]) + '</td><td>' + (esc(AUTEUR[i]) || '—') + '</td><td>' + (COTE[i] ? '<span class="pro-cote-cell">' + esc(COTE[i]) + '</span>' : '—') + '</td>' +
      '<td class="dst-meta">' + (esc(FONDS[FONDS_I[i]]) || '—') + '</td><td class="is-num dst-meta">' + fn(CUM[i]) + '</td><td class="dst-meta">' + lastLabel(DERN[i]) + '</td>' +
      '<td>' + (PIEGE[i] ? '<span class="pro-pill pro-pill--pret dst-piege">' + esc(PIEGE[i]) + '</span>' : '—') + '</td><td class="pro-mono dst-meta">' + (esc(BC[i]) || '—') + '</td></tr>',
    after: view => { $('dorm-export').textContent = '⬇ Exporter (.txt) · ' + fn(view.length); }
  });
  $('dorm-hist').addEventListener('click', e => {
    const b = e.target.closest('button[data-hist]');
    if (!b) return;
    setDormHist(b.dataset.hist);
    dormTable.page = 1; dormTable.render();
  });
  $('dorm-piege').addEventListener('change', e => { dormState.piege = e.target.value; dormTable.page = 1; dormTable.render(); });
  $('dorm-export').addEventListener('click', () => {
    const view = dormTable.current();
    if (!view.length) { ui.toast('Aucun exemplaire à exporter avec les filtres actuels.', { type: 'warn' }); return; }
    const codes = [];
    for (let j = 0; j < view.length; j++) if (BC[view[j]]) codes.push(BC[view[j]]);
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    downloadTxt(codes.join('\n') + '\n', 'desherbage-dormants-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.txt');
    ui.toast({ title: 'Export prêt.', text: fn(codes.length) + ' codes-barres.' }, { type: 'ok' });
  });
}
function setDormHist(v) {
  dormState.hist = v;
  document.querySelectorAll('#dorm-hist button').forEach(b => b.setAttribute('aria-pressed', b.dataset.hist === v ? 'true' : 'false'));
}
function downloadTxt(text, filename) {
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.download = filename; a.href = URL.createObjectURL(blob); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 300);
}

  h += '<details class="pro-help dst-tabnote" id="dorm-help" style="margin-top:.875rem"><summary><span>Comment lire cette liste</span>' + ui.icon('chevDown', { size: 16 }).replace('<svg ', '<svg class="pro-help__chev" ') + '</summary><div class="pro-help__body">' +
    '<p>Un exemplaire est dit <strong>dormant</strong> quand il n\'a aucun prêt sur les 4 années disponibles (' + ys[0] + ' à ' + ys[3] + ', ' + ys[3] + ' étant l\'année en cours). Pour savoir depuis quand, la colonne « Dernier prêt » donne l\'année du dernier prêt enregistré : <strong>« 2007 ou avant »</strong> regroupe tous les prêts antérieurs à la mise en service du SIGB (l\'année exacte n\'est pas connue) ; « jamais » signifie qu\'aucun prêt n\'a été enregistré.</p>' +
    '<p>La colonne « Piège » (champ Syracuse 921) indique si la bibliothèque a déjà statué sur l\'exemplaire (pilon, braderie, exclu du prêt…) : un dormant <em>sans</em> piège est le candidat le plus utile à vérifier physiquement.</p></div></details>';
  h += '<div class="pro-card pro-card--pad" style="margin-top:.875rem"><p class="pro-label pro-card__label">Fraîcheur</p><h2 class="pro-card__title" style="margin-bottom:.3rem">Dernière année de prêt des dormants</h2>' +

}

/* ═══ Orchestration : périmètre, onglets ══════════════════════════════ */
function updateScopeUi() {
  const a = agg(scope);
  document.querySelectorAll('#dst-scope-seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === scope ? 'true' : 'false'));
  $('dst-scope-count').innerHTML = '<strong>' + fn(a.count) + '</strong> exemplaires dans la sélection';
  const tc = $('dst-tabcount');
  tc.textContent = fn(a.dorm); tc.hidden = false;
}
function renderTab(id) {
  if (!dirty[id]) return;
  dirty[id] = false;
  if (id === 'overview') renderOverview();
  else if (id === 'sections') renderSections();
  else if (id === 'dormants') renderDormants();
  else if (id === 'exemplaires') exTable.render();
  if (window.rpEmbed && window.rpEmbed.refresh) window.rpEmbed.refresh();
}
function setScope(sc) {
  if (sc === scope) return;
  scope = sc;
  Object.keys(dirty).forEach(k => { dirty[k] = true; });
  if (exTable) exTable.reset();
  if (dormTable) dormTable.reset();
  updateScopeUi();
  renderTab(activeTab);
}

$('dst-scope-seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-scope]');
  if (b && DATA_READY) setScope(b.dataset.scope);
});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-goto-dormants]');
  if (!a || !DATA_READY) return;
  setDormHist(a.dataset.gotoDormants);
  if (dormTable) dormTable.reset();
  dirty.dormants = true;
});

let DATA_READY = false, tabsApi = null;
tabsApi = ui.tabs($('dst-head'), { hashPrefix: 'onglet=' });
activeTab = tabsApi ? tabsApi.current() : 'overview';
$('dst-head').addEventListener('rp-tab-change', e => {
  activeTab = e.detail.id;
  if (DATA_READY) renderTab(activeTab);
});
charts.attachTooltips(document.body);
narrow.addEventListener('change', () => { if (DATA_READY) { dirty.overview = true; if (activeTab === 'overview') renderTab('overview'); } });

/* ═══ Chargement ═════════════════════════════════════════════════════ */
console.time('chargement + extraction');
Promise.all([
  fetch('data/desherbage.json').then(r => { if (!r.ok) throw new Error('desherbage.json : HTTP ' + r.status); return r.json(); }),
  fetch('data/desherbage-build-report.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))
]).then(([data, report]) => {
  REF = (report && report.stats && report.stats.referenceYear) || REF;
  BUILT_AT = (report && report.generatedAt) || null;
  extract(data);
  console.timeEnd('chargement + extraction');
  $('dst-export').className = 'pro-sync';
  $('dst-export-text').textContent = BUILT_AT ? 'Export du ' + fmt.date(BUILT_AT) : 'Date des données inconnue';
  document.querySelectorAll('#dst-scope-seg small').forEach(s => { s.textContent = fn(agg(s.parentNode.dataset.scope).count); });
  buildExTable();
  buildDormTable();
  DATA_READY = true;
  updateScopeUi();
  renderTab(activeTab);
  window.__dstReady = true;
}).catch(err => {
  console.error(err);
  ['ov-body', 'sec-body', 'dorm-top'].forEach(id => { const el = $(id); el.className = ''; el.innerHTML = emptyState('Données indisponibles', 'Impossible de charger data/desherbage.json — lancez « npm run build:desherbage ».'); });
  $('ex-body').innerHTML = '<tr><td colspan="13"><div class="pro-empty">Données indisponibles.</div></td></tr>';
  $('dst-export-text').textContent = 'Données indisponibles';
  $('dst-export').className = 'pro-sync pro-sync--off';
});

})();
</script>
</body>
</html>
