    .ac-legend i { display: block; width: 12px; height: 12px; background: var(--pro-bleu); }
    .ac-legend i.is-free { background: var(--ac-free); border: 1px solid #E29AA8; }
    .ac-dens { --ac-free: #F4C3CD; display: flex; gap: 0.5rem; }
    .ac-dens__y { position: relative; flex: none; width: 3rem; height: var(--ac-h, 150px); }
    .ac-dens__y span { position: absolute; right: 0; transform: translateY(50%); font-size: 0.72rem; color: var(--pro-texte-doux); line-height: 1; }

    .ac-dens__plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .ac-dens__x span.is-start { transform: none; }
    .ac-dens__x span.is-end { transform: translateX(-100%); }
    .ac-dens-cap { margin-top: 0.5rem; font-size: 0.72rem; color: var(--pro-texte-doux); }

    /* Tableaux */
    .ac-dup-table th, .ac-dup-table td { vertical-align: top; }
    .ac-table-card .pro-table th { position: static; }
    .ac-toolbar-spacer { flex: 1 1 auto; }
    .ac-count { font-size: 0.8rem; color: var(--pro-texte); white-space: nowrap; }
    .ac-count strong { color: var(--pro-bleu); }
    .ac-neigh-title { display: block; margin-top: 0.15rem; font-size: 0.72rem; line-height: 1.35; color: var(--pro-texte-doux); max-width: 30rem; }
    .ac-free-num { font: 700 0.9rem var(--pro-font-mono); color: var(--pro-bleu); }
    .ac-free-num small { font-weight: 400; color: var(--pro-texte-doux); font-size: 0.7rem; }
    .ac-dup-cote { font: 700 0.85rem var(--pro-font-mono); color: var(--pro-carmin-fonce); white-space: nowrap; }
    .ac-titles { margin: 0; padding: 0; list-style: none; }
    .ac-titles li { padding: 0.2rem 0; border-bottom: 1px dotted var(--pro-trait); font-size: 0.8rem; line-height: 1.4; }
    .ac-titles li:first-child { padding-top: 0; }

    .ac-dup-table th:nth-child(1) { width: 11rem; }
    .ac-dup-table th:nth-child(2) { width: 8rem; }
    .ac-more { margin-top: 0.3rem; }
    .ac-more > summary { cursor: pointer; font-size: 0.78rem; font-weight: 600; color: var(--pro-carmin); min-height: 28px; display: flex; align-items: center; }
    .ac-more[open] > summary { margin-bottom: 0.3rem; }
    .ac-pagesize { height: 44px; width: auto; padding: 0 0.5rem; font-size: 0.8rem; }

    /* Squelette de chargement */

    .ac-skel-kpis > span { flex: 1 1 200px; height: 5.5rem; }

    @media (max-width: 40rem) {
      .ac-dens__y { width: 2.4rem; }
      .ac-dens__x { margin-left: calc(2.4rem + 0.5rem); }
      .ac-toolbar-spacer { display: none; }
    }
  </style>

<script src="js/admin-ui.js"></script>
<script src="js/admin-charts.js"></script>
<script>
(function () {
'use strict';

var ui = window.rpUI, charts = window.rpCharts, fmt = ui.fmt, esc = ui.esc;
function $(id) { return document.getElementById(id); }

/* ════════════════════════════════════════════════════════════
   ANALYSE DES COTES — chargement depuis data/inventaire.json
   ════════════════════════════════════════════════════════════
   Le fonds d'un document est déterminé par le préfixe de sa cote
   (930$g), selon la même règle que js/inventaire.js. Seuls les
   fonds à numérotation séquentielle simple sont analysables ici
   (trous / densité) : les cotes hiérarchiques comme "I-17-1664-1-11"
   (Imprimés) ou "RD-18-1791-1" (Réserve Douaisienne) sont hors
   périmètre — la notion de "trou" n'a pas de sens pour elles.
   ════════════════════════════════════════════════════════════ */

var FONDS_DEF = [
  { prefix: 'D',   label: 'Douaisien' },
  { prefix: 'P',   label: 'Protestantisme' },
  { prefix: 'MIN', label: 'Mines' },
  { prefix: 'L',   label: 'Littérature' }
];

/* Au-delà de cet écart entre deux numéros utilisés consécutifs, on
   considère qu'il s'agit d'un nouveau bloc de cotes (campagne de
   numérotation différente) plutôt que d'un trou à combler. */
var TRANCHE_GAP_THRESHOLD = 1000;

var DUP_KEY = '__dup__';

/* Données calculées */
var SERIES = {};        /* clé "PREFIX__i" -> { label, prefix, min, max, used:Set, items:Map, gaps? } */
var SERIES_ORDER = [];
var ALL_COTES_MAP = {}; /* doublons, scopés aux fonds analysés */
var FONDS_SUMMARY = []; /* pour le bandeau "prochain numéro disponible" */
var DUPS = [];          /* [[cote, [{titre}]]] triés */

function parseCoteNumber(cote, prefix) {
  var up = (cote || '').split(',')[0].trim().toUpperCase();
  if (!up.startsWith(prefix)) return null;
  var m = /^(\d+)/.exec(up.slice(prefix.length));
  return m ? parseInt(m[1], 10) : null;
}

function clusterTranches(usedSet, threshold) {
  var sorted = Array.from(usedSet).sort(function (a, b) { return a - b; });
  var tranches = [];
  var start = sorted[0], prev = sorted[0];
  for (var i = 1; i < sorted.length; i++) {
    var n = sorted[i];
    if (n - prev > threshold) { tranches.push({ min: start, max: prev }); start = n; }
    prev = n;
  }
  tranches.push({ min: start, max: prev });
  return tranches;
}

function buildCotesAnalysis(rows) {
  SERIES = {};
  SERIES_ORDER = [];
  ALL_COTES_MAP = {};
  FONDS_SUMMARY = [];

  var fondsData = {};
  FONDS_DEF.forEach(function (f) { fondsData[f.prefix] = { used: new Set(), items: new Map() }; });

  rows.forEach(function (row) {
    var cote  = (row['930$g'] || '').trim();
    var titre = (row['200$a'] || '').trim().slice(0, 100);
    if (!cote) return;

    var matched = null, n1 = null;
    for (var k = 0; k < FONDS_DEF.length; k++) {
      var num = parseCoteNumber(cote, FONDS_DEF[k].prefix);
      if (num !== null) { matched = FONDS_DEF[k]; n1 = num; break; }
    }
    if (!matched) return; /* fonds non séquentiel : hors périmètre de l'outil */

    if (!ALL_COTES_MAP[cote]) ALL_COTES_MAP[cote] = [];
    ALL_COTES_MAP[cote].push({ titre: titre });

    var fd = fondsData[matched.prefix];
    fd.used.add(n1);
    if (!fd.items.has(n1)) fd.items.set(n1, []);
    fd.items.get(n1).push({ cote: cote, titre: titre });
  });

  /* Construire une série par tranche détectée automatiquement */
  FONDS_DEF.forEach(function (f) {
    var fd = fondsData[f.prefix];
    if (!fd.used.size) return;
    var tranches = clusterTranches(fd.used, TRANCHE_GAP_THRESHOLD);
    tranches.forEach(function (t, i) {
      var used = new Set(Array.from(fd.used).filter(function (n) { return n >= t.min && n <= t.max; }));
      var items = new Map(Array.from(fd.items).filter(function (e) { return e[0] >= t.min && e[0] <= t.max; }));
      var key = f.prefix + '__' + i;
      SERIES[key] = {
        key: key,
        label: tranches.length > 1 ? f.label + ' ' + fmt.n(t.min) + ' – ' + fmt.n(t.max) : f.label,
        fonds: f.label, prefix: f.prefix, min: t.min, max: t.max, used: used, items: items
      };
      SERIES_ORDER.push(key);
    });
    var last = 0;
    fd.used.forEach(function (n) { if (n > last) last = n; });
    FONDS_SUMMARY.push({ label: f.label, prefix: f.prefix, lastUsed: last });
  });

  DUPS = Object.keys(ALL_COTES_MAP)
    .filter(function (c) { return ALL_COTES_MAP[c].length > 1; })
    .map(function (c) { return [c, ALL_COTES_MAP[c]]; })
    .sort(function (a, b) { return b[1].length - a[1].length || a[0].localeCompare(b[0], 'fr'); });
}

/* ════ Calcul des trous (balayage linéaire) ════ */
function getGaps(s) {
  if (s.gaps) return s.gaps;
  var usedArr = Array.from(s.used).sort(function (a, b) { return a - b; });
  var gaps = [], j = 0, prev = null;
  for (var i = s.min; i <= s.max; i++) {
    if (s.used.has(i)) { prev = i; continue; }
    while (j < usedArr.length && usedArr[j] <= i) j++;
    var next = j < usedArr.length ? usedArr[j] : null;
    gaps.push({
      n: i,
      prevN: prev, prevItem: prev != null ? s.items.get(prev) : null,
      nextN: next, nextItem: next != null ? s.items.get(next) : null
    });
  }
  s.gaps = gaps;
  return gaps;
}

function itemCote(item, n) { return (item && item[0] && item[0].cote) || (n != null ? 'n°' + n : ''); }
function itemTitre(item) { return (item && item[0] && item[0].titre) || ''; }

/* ════ Onglets ════ */
function renderTabs() {
  var list = $('ac-tablist');
  var html = '<button type="button" role="tab" class="pro-tab" data-tab="' + DUP_KEY + '" aria-controls="ac-p-' + DUP_KEY + '">' +
    ui.icon('warn', { size: 16 }) + '<span>Doublons</span><span class="pro-tab__count">' + fmt.n(DUPS.length) + '</span></button>';
  SERIES_ORDER.forEach(function (key) {
    var s = SERIES[key];
    html += '<button type="button" role="tab" class="pro-tab" data-tab="' + esc(key) + '" aria-controls="ac-p-' + esc(key) + '">' +
      '<span>' + esc(s.label) + '</span><span class="pro-tab__count">' + fmt.n(s.used.size) + '</span></button>';
  });
  list.innerHTML = html;
}

function renderPanelShells() {
  var host = $('ac-panels');
  var html = '<section class="ac-panel" id="ac-p-' + DUP_KEY + '" data-tab="' + DUP_KEY + '" hidden></section>';
  SERIES_ORDER.forEach(function (key) {
    html += '<section class="ac-panel" id="ac-p-' + esc(key) + '" data-tab="' + esc(key) + '" hidden></section>';
  });
  host.innerHTML = html;
}

/* Les panneaux sont construits à la première ouverture : la plupart des
   séries ne seront jamais consultées. */
var BUILT = {};
function ensurePanel(id) {
  if (BUILT[id]) return;
  BUILT[id] = true;
  var el = $('ac-p-' + id);
  if (!el) return;
  if (id === DUP_KEY) buildDupPanel(el); else buildSeriesPanel(el, SERIES[id]);
}

/* ════ Bandeau « prochains numéros » ════ */
function renderNext() {
  $('ac-next').innerHTML = FONDS_SUMMARY.map(function (f) {
    var next = f.prefix + (f.lastUsed + 1);
    return '<div class="pro-kpi"><p class="pro-kpi__label">' + esc(f.label) + '</p>' +
      '<div class="pro-kpi__row"><span class="pro-kpi__value pro-mono" style="font-family:var(--pro-font-display)">' + esc(next) + '</span></div>' +
      '<p class="pro-kpi__note">Après ' + esc(f.prefix + f.lastUsed) + ', la plus haute cote utilisée</p></div>';
  }).join('');
  $('ac-total-note').textContent = fmt.n(Object.keys(ALL_COTES_MAP).length) + ' cotes analysées (fonds ' +
    FONDS_DEF.map(function (f) { return f.label; }).join(', ') + ')';
}

/* ════ Pagination ════ */
function pageList(cur, pages) {
  if (pages <= 7) { var all = []; for (var p = 1; p <= pages; p++) all.push(p); return all; }
  var set = {};
  [1, pages, cur - 1, cur, cur + 1].forEach(function (p) { if (p >= 1 && p <= pages) set[p] = 1; });
  return Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
}

/* Dessine la pagination dans `el` ; st = {page, perPage}, count = nombre de lignes. */
function renderPager(el, st, count, noun, onChange) {
  var pages = Math.max(1, Math.ceil(count / st.perPage));
  if (st.page > pages) st.page = pages;
  var start = (st.page - 1) * st.perPage;
  var info = count ? fmt.n(start + 1) + '–' + fmt.n(Math.min(start + st.perPage, count)) + ' sur ' + fmt.n(count) + ' ' + noun + (count > 1 ? 's' : '') : 'Aucun résultat';
  var nav = '<select class="pro-input ac-pagesize" aria-label="Lignes par page" data-size>' +
    [25, 50, 100, 200].map(function (n) { return '<option value="' + n + '"' + (n === st.perPage ? ' selected' : '') + '>' + n + ' / page</option>'; }).join('') + '</select>';
  nav += '<button type="button" class="pro-btn pro-btn--ghost pro-btn--icon" data-page="' + (st.page - 1) + '" aria-label="Page précédente"' + (st.page <= 1 ? ' disabled' : '') + '>' + ui.icon('chevLeft', { size: 18 }) + '</button>';
  var prev = 0;
  pageList(st.page, pages).forEach(function (p) {
    if (p - prev > 1) nav += '<span class="pro-pager__gap" aria-hidden="true">…</span>';
    nav += '<button type="button" class="pro-btn pro-btn--ghost pro-btn--icon" data-page="' + p + '" aria-label="Page ' + p + '"' + (p === st.page ? ' aria-current="page"' : '') + '>' + p + '</button>';
    prev = p;
  });
  nav += '<button type="button" class="pro-btn pro-btn--ghost pro-btn--icon" data-page="' + (st.page + 1) + '" aria-label="Page suivante"' + (st.page >= pages ? ' disabled' : '') + '>' + ui.icon('chevRight', { size: 18 }) + '</button>';
  el.innerHTML = '<span class="pro-pager__info">' + esc(info) + '</span><div class="pro-pager__nav">' + nav + '</div>';
  el.hidden = false;
  var sel = el.querySelector('[data-size]');
  sel.addEventListener('change', function () { st.perPage = parseInt(sel.value, 10); st.page = 1; onChange(false); });
  el.querySelectorAll('[data-page]').forEach(function (b) {
    b.addEventListener('click', function () { st.page = parseInt(b.getAttribute('data-page'), 10); onChange(true); });
  });
}

/* ════ Export CSV ════ */
function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
function downloadCsv(lines, filename, nbLines) {
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  ui.toast({ title: 'Export prêt.', text: filename + ' — ' + fmt.n(nbLines) + ' ligne' + (nbLines > 1 ? 's' : '') + '.' }, { type: 'ok' });
}

var SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-5-5"/></svg>';

/* ════ Panneau série ════ */
function buildSeriesPanel(el, s) {
  var gaps = getGaps(s);
  var span = s.max - s.min + 1;
  var fill = span > 0 ? s.used.size / span : 1;

  el.innerHTML =
    '<div class="pro-section-head ac-panel-head"><h2 class="pro-eyebrow">' + esc(s.label) + '</h2><span class="pro-rule" aria-hidden="true"></span></div>' +
    '<div class="ac-stack">' +
    '<div class="pro-kpis">' +
      '<div class="pro-kpi"><p class="pro-kpi__label">Cotes utilisées</p><div class="pro-kpi__row"><span class="pro-kpi__value">' + fmt.n(s.used.size) + '</span></div>' +
        '<p class="pro-kpi__note">numéros distincts attribués</p></div>' +
      '<div class="pro-kpi' + (gaps.length ? ' pro-kpi--alert' : '') + '"><p class="pro-kpi__label">Trous (libres)</p><div class="pro-kpi__row"><span class="pro-kpi__value">' + fmt.n(gaps.length) + '</span></div>' +
        '<p class="pro-kpi__note">' + (gaps.length ? 'numéros libres entre le premier et le dernier' : 'aucun numéro libre dans la plage') + '</p></div>' +
      '<div class="pro-kpi ac-kpi-range"><p class="pro-kpi__label">Plage</p><div class="pro-kpi__row"><span class="pro-kpi__value">' + fmt.n(s.min) + ' – ' + fmt.n(s.max) + '</span></div>' +
        '<p class="pro-kpi__note">' + fmt.n(span) + ' numéro' + (span > 1 ? 's' : '') + ' de bout en bout</p></div>' +
      '<div class="pro-kpi"><p class="pro-kpi__label">Remplissage</p><div class="pro-kpi__row"><span class="pro-kpi__value">' + fmt.pct(fill, fill < 0.1 ? 1 : 0) + '</span></div>' +
        '<p class="pro-kpi__note">part de la plage effectivement utilisée</p></div>' +
    '</div>' +
    '<div class="pro-card pro-card--pad" data-density></div>' +
    '<div class="pro-card ac-table-card" data-gaps></div>' +
    '</div>';

  buildDensity(el.querySelector('[data-density]'), s);
  buildGapsTable(el.querySelector('[data-gaps]'), s, gaps);
}

/* ════ Carte de densité : une colonne = un paquet de numéros consécutifs,
   bleu = part utilisée, rose = part libre (trous). Infobulle au survol. ════ */
function buildDensity(host, s) {
  var span = s.max - s.min + 1;
  var B = Math.min(240, span);
  var lo = [];
  for (var i = 0; i <= B; i++) lo.push(Math.ceil(i * span / B));
  var counts = new Array(B).fill(0);
  s.used.forEach(function (n) {
    var b = Math.min(B - 1, Math.floor((n - s.min) * B / span));
    counts[b]++;
  });

  var rects = '';
  var fullFree = 0;
  for (var b = 0; b < B; b++) {
    var cap = lo[b + 1] - lo[b];
    var c = counts[b];
    var a = s.min + lo[b], z = s.min + lo[b + 1] - 1;
    if (c === 0) fullFree++;
    var title = (a === z ? 'N° ' + fmt.n(a) : 'N° ' + fmt.n(a) + ' – ' + fmt.n(z));
    var tip = title + '\n' + fmt.n(c) + ' utilisé' + (c > 1 ? 's' : '') + ' · ' + fmt.n(cap - c) + ' libre' + (cap - c > 1 ? 's' : '') +
      '\nRemplissage ' + fmt.pct(cap ? c / cap : 0, 0);
    var h = cap ? c / cap * 100 : 0;
    rects += '<g data-tip="' + esc(tip).replace(/\n/g, '&#10;') + '">' +
      '<rect x="' + b + '" y="0" width="1" height="100" fill="#F4C3CD"/>' +
      (h > 0 ? '<rect x="' + b + '" y="' + (100 - h).toFixed(2) + '" width="1" height="' + h.toFixed(2) + '" fill="#2A3CD4" stroke="#fff" stroke-width="0.6" vector-effect="non-scaling-stroke"/>' : '') +
      '</g>';
  }

  /* Graduation X : valeurs rondes réparties sur la plage */
  var step = charts.niceTicks(span, 5).step;
  var xs = '';
  for (var v = Math.ceil(s.min / step) * step; v <= s.max; v += step) {
    var pos = (v - s.min) / span * 100;
    xs += '<span class="' + (pos < 4 ? 'is-start' : pos > 96 ? 'is-end' : '') + '" style="left:' + pos.toFixed(2) + '%">' + fmt.n(v) + '</span>';
  }

  var aria = 'Carte de densité de ' + s.label + ' : ' + fmt.n(s.used.size) + ' numéros utilisés et ' + fmt.n(span - s.used.size) +
    ' libres sur la plage ' + fmt.n(s.min) + ' à ' + fmt.n(s.max) + '. Le tableau des trous ci-dessous donne le détail.';

  host.innerHTML =
    '<div class="ac-chart-head"><h3 class="pro-label">Carte de densité — ' + esc(s.label) + '</h3>' +
    '<div class="ac-legend" aria-hidden="true"><span><i></i>Numéros utilisés</span><span><i class="is-free"></i>Numéros libres (trous)</span></div></div>' +
    '<div class="pro-chart" role="img" aria-label="' + esc(aria) + '">' +
      '<div class="ac-dens" style="--ac-h:150px">' +
        '<div class="ac-dens__y" aria-hidden="true"><span style="bottom:100%">100 %</span><span style="bottom:50%">50 %</span><span style="bottom:0">0 %</span></div>' +
        '<div class="ac-dens__plot"><span class="ac-dens__grid" style="bottom:50%"></span>' +
          '<svg viewBox="0 0 ' + B + ' 100" preserveAspectRatio="none" focusable="false">' + rects + '</svg></div>' +
      '</div>' +
      '<div class="ac-dens__x" aria-hidden="true">' + xs + '</div>' +
    '</div>' +
    '<p class="ac-dens-cap">Chaque colonne regroupe ' + (span / B >= 1.5 ? 'environ ' + fmt.n(Math.round(span / B)) : fmt.n(Math.max(1, Math.round(span / B)))) +
    ' numéro' + (span / B >= 1.5 ? 's' : '') + ' consécutif' + (span / B >= 1.5 ? 's' : '') + ' : la part bleue est la part utilisée, la part rose la part libre. ' +
    (fullFree ? fmt.n(fullFree) + ' colonne' + (fullFree > 1 ? 's' : '') + ' sur ' + fmt.n(B) + ' ne contien' + (fullFree > 1 ? 'nent' : 't') + ' aucune cote.' : 'Aucune colonne entièrement vide.') + '</p>';
}

/* ════ Tableau des trous ════ */
function buildGapsTable(host, s, gaps) {
  var st = { page: 1, perPage: 25, q: '' };
  var filtered = gaps;
  var id = 'g-' + s.key;

  if (!gaps.length) {
    host.innerHTML = '<div class="pro-empty" style="border:0">' + ui.icon('checkCircle', { size: 32, stroke: 1.6 }) +
      '<div class="pro-empty__title">Aucun numéro libre</div><div class="pro-empty__text">Tous les numéros de la plage ' +
      esc(fmt.n(s.min) + ' – ' + fmt.n(s.max)) + ' sont attribués.</div></div>';
    return;
  }

  host.innerHTML =
    '<div class="pro-toolbar">' +
      '<label class="pro-search"><span class="pro-sr">Filtrer les numéros libres</span>' + SEARCH_ICON +
        '<input type="search" class="pro-input" id="' + id + '-q" placeholder="Filtrer par numéro ou par cote voisine…" autocomplete="off"></label>' +
      '<span class="ac-count" data-count aria-live="polite"></span>' +
      '<span class="ac-toolbar-spacer"></span>' +
      '<button type="button" class="pro-btn pro-btn--secondary" data-export>' + ui.icon('download', { size: 18 }) + '<span data-export-label>Exporter en CSV</span></button>' +
    '</div>' +
    '<div class="pro-table-wrap pro-table-wrap--free"><table class="pro-table">' +
      '<caption class="pro-sr">Numéros libres de la série ' + esc(s.label) + '</caption>' +
      '<thead><tr><th scope="col">N° libre</th><th scope="col">Cote précédente</th><th scope="col">Cote suivante</th></tr></thead>' +
      '<tbody data-body></tbody></table></div>' +
    '<div class="pro-pager" data-pager></div>';

  var body = host.querySelector('[data-body]');
  var pager = host.querySelector('[data-pager]');
  var count = host.querySelector('[data-count]');
  var exportLabel = host.querySelector('[data-export-label]');

  function neighbour(item, n) {
    if (!item) return '<span class="pro-muted">—</span>';
    var t = itemTitre(item);
    return '<span class="pro-cote">' + esc(itemCote(item, n)) + '</span>' +
      (t ? '<span class="ac-neigh-title">' + esc(t.slice(0, 90)) + '</span>' : '');
  }

  function draw(scroll) {
    var total = filtered.length;
    var pages = Math.max(1, Math.ceil(total / st.perPage));
    if (st.page > pages) st.page = pages;
    var start = (st.page - 1) * st.perPage;
    var slice = filtered.slice(start, start + st.perPage);
    body.innerHTML = slice.length ? slice.map(function (g) {
      return '<tr><td><span class="ac-free-num"><small>' + esc(s.prefix) + '</small>' + g.n + '</span></td>' +
        '<td>' + neighbour(g.prevItem, g.prevN) + '</td><td>' + neighbour(g.nextItem, g.nextN) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="pro-muted" style="text-align:center;padding:1.5rem">Aucun numéro libre ne correspond à « ' + esc(st.q) + ' ».</td></tr>';
    count.innerHTML = st.q ? '<strong>' + fmt.n(total) + '</strong> sur ' + fmt.n(gaps.length) + ' numéros libres'
      : '<strong>' + fmt.n(total) + '</strong> numéro' + (total > 1 ? 's' : '') + ' libre' + (total > 1 ? 's' : '');
    exportLabel.textContent = st.q ? 'Exporter la sélection (CSV)' : 'Exporter en CSV';
    renderPager(pager, st, total, 'trou', draw);
    if (scroll) host.scrollIntoView({ block: 'nearest' });
  }

  host.querySelector('#' + id + '-q').addEventListener('input', function (ev) {
    var val = ev.target.value.trim();
    st.q = val;
    if (!val) filtered = gaps;
    else if (/\d/.test(val)) {
      var d = val.replace(/\D/g, '');
      filtered = gaps.filter(function (g) { return String(g.n).indexOf(d) !== -1; });
    } else {
      var lv = val.toLowerCase();
      filtered = gaps.filter(function (g) {
        return (itemCote(g.prevItem, g.prevN) + ' ' + itemTitre(g.prevItem) + ' ' + itemCote(g.nextItem, g.nextN) + ' ' + itemTitre(g.nextItem)).toLowerCase().indexOf(lv) !== -1;
      });
    }
    st.page = 1;
    draw(false);
  });

  host.querySelector('[data-export]').addEventListener('click', function () {
    var lines = ['Numéro libre,Cote précédente,Titre précédent,Cote suivante,Titre suivant'];
    filtered.forEach(function (g) {
      lines.push([g.n, itemCote(g.prevItem, g.prevN), itemTitre(g.prevItem), itemCote(g.nextItem, g.nextN), itemTitre(g.nextItem)].map(csvCell).join(','));
    });
    downloadCsv(lines, 'trous_cotes_' + s.key + '.csv', filtered.length);
  });

  draw(false);
}

/* Une cote peut être portée par plusieurs dizaines de notices : on en montre
   quelques-unes et le reste se déplie, pour garder des lignes lisibles. */
var TITLES_SHOWN = 5;
function titlesHtml(items) {
  function li(it) { return '<li>' + esc(it.titre || '(sans titre)') + '</li>'; }
  var html = '<ul class="ac-titles">' + items.slice(0, TITLES_SHOWN).map(li).join('') + '</ul>';
  if (items.length > TITLES_SHOWN) {
    var rest = items.length - TITLES_SHOWN;
    html += '<details class="ac-more"><summary>… et ' + fmt.n(rest) + ' autre' + (rest > 1 ? 's' : '') + ' notice' + (rest > 1 ? 's' : '') + '</summary>' +
      '<ul class="ac-titles">' + items.slice(TITLES_SHOWN).map(li).join('') + '</ul></details>';
  }
  return html;
}

/* ════ Panneau doublons ════ */
function buildDupPanel(el) {
  var totalCotes = Object.keys(ALL_COTES_MAP).length;
  var notices = DUPS.reduce(function (n, d) { return n + d[1].length; }, 0);

  el.innerHTML =
    '<div class="pro-section-head ac-panel-head"><h2 class="pro-eyebrow">Doublons de cotes</h2><span class="pro-rule" aria-hidden="true"></span></div>' +
    '<div class="ac-stack">' +
    '<div class="pro-kpis">' +
      '<div class="pro-kpi"><p class="pro-kpi__label">Cotes totales</p><div class="pro-kpi__row"><span class="pro-kpi__value">' + fmt.n(totalCotes) + '</span></div><p class="pro-kpi__note">cotes distinctes analysées</p></div>' +
      '<div class="pro-kpi' + (DUPS.length ? ' pro-kpi--alert' : '') + '"><p class="pro-kpi__label">Cotes en doublon</p><div class="pro-kpi__row"><span class="pro-kpi__value">' + fmt.n(DUPS.length) + '</span></div><p class="pro-kpi__note">attribuées à plusieurs notices</p></div>' +
      '<div class="pro-kpi' + (DUPS.length ? ' pro-kpi--alert' : '') + '"><p class="pro-kpi__label">Notices concernées</p><div class="pro-kpi__row"><span class="pro-kpi__value">' + fmt.n(notices) + '</span></div><p class="pro-kpi__note">à reclasser ou à corriger</p></div>' +
      '<div class="pro-kpi"><p class="pro-kpi__label">Cotes uniques</p><div class="pro-kpi__row"><span class="pro-kpi__value">' + fmt.n(totalCotes - DUPS.length) + '</span></div><p class="pro-kpi__note">une seule notice</p></div>' +
    '</div>' +
    '<div class="pro-card ac-table-card" data-dups></div>' +
    '</div>';

  var host = el.querySelector('[data-dups]');
  if (!DUPS.length) {
    host.innerHTML = '<div class="pro-empty" style="border:0">' + ui.icon('checkCircle', { size: 32, stroke: 1.6 }) +
      '<div class="pro-empty__title">Aucun doublon détecté</div><div class="pro-empty__text">Toutes les cotes analysées sont uniques.</div></div>';
    return;
  }

  var st = { page: 1, perPage: 25, q: '' };
  var filtered = DUPS;

  host.innerHTML =
    '<div class="pro-toolbar">' +
      '<label class="pro-search"><span class="pro-sr">Filtrer les doublons</span>' + SEARCH_ICON +
        '<input type="search" class="pro-input" id="dup-q" placeholder="Filtrer par cote ou par titre…" autocomplete="off"></label>' +
      '<span class="ac-count" data-count aria-live="polite"></span>' +
      '<span class="ac-toolbar-spacer"></span>' +
      '<button type="button" class="pro-btn pro-btn--secondary" data-export>' + ui.icon('download', { size: 18 }) + '<span data-export-label>Exporter en CSV</span></button>' +
    '</div>' +
    '<div class="pro-table-wrap pro-table-wrap--free"><table class="pro-table ac-dup-table">' +
      '<caption class="pro-sr">Cotes attribuées à plusieurs notices</caption>' +
      '<thead><tr><th scope="col">Cote</th><th scope="col">Occurrences</th><th scope="col">Titres des notices</th></tr></thead>' +
      '<tbody data-body></tbody></table></div>' +
    '<div class="pro-pager" data-pager></div>';

  var body = host.querySelector('[data-body]');
  var pager = host.querySelector('[data-pager]');
  var count = host.querySelector('[data-count]');
  var exportLabel = host.querySelector('[data-export-label]');

  function draw(scroll) {
    var total = filtered.length;
    var pages = Math.max(1, Math.ceil(total / st.perPage));
    if (st.page > pages) st.page = pages;
    var start = (st.page - 1) * st.perPage;
    body.innerHTML = total ? filtered.slice(start, start + st.perPage).map(function (d) {
      return '<tr><td><span class="ac-dup-cote">' + esc(d[0]) + '</span></td>' +
        '<td><span class="pro-pill pro-pill--anomalie">' + d[1].length + '×</span></td>' +
        '<td>' + titlesHtml(d[1]) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="pro-muted" style="text-align:center;padding:1.5rem">Aucun doublon ne correspond à « ' + esc(st.q) + ' ».</td></tr>';
    count.innerHTML = st.q ? '<strong>' + fmt.n(total) + '</strong> sur ' + fmt.n(DUPS.length) + ' cotes en doublon'
      : '<strong>' + fmt.n(total) + '</strong> cote' + (total > 1 ? 's' : '') + ' en doublon';
    exportLabel.textContent = st.q ? 'Exporter la sélection (CSV)' : 'Exporter en CSV';
    renderPager(pager, st, total, 'cote', draw);
    if (scroll) host.scrollIntoView({ block: 'nearest' });
  }

  host.querySelector('#dup-q').addEventListener('input', function (ev) {
    var val = ev.target.value.trim();
    st.q = val;
    var lv = val.toLowerCase();
    filtered = !val ? DUPS : DUPS.filter(function (d) {
      return d[0].toLowerCase().indexOf(lv) !== -1 || d[1].some(function (it) { return (it.titre || '').toLowerCase().indexOf(lv) !== -1; });
    });
    st.page = 1;
    draw(false);
  });

  host.querySelector('[data-export]').addEventListener('click', function () {
    var lines = ['Cote,Nb occurrences,Titre'];
    var n = 0;
    filtered.forEach(function (d) {
      d[1].forEach(function (it) { lines.push([d[0], d[1].length, it.titre || ''].map(csvCell).join(',')); n++; });
    });
    downloadCsv(lines, 'doublons_cotes.csv', n);
  });

  draw(false);
}

/* ════════════ DÉMARRAGE ════════════ */
function showError(message) {
  $('ac-loading').hidden = true;
  var box = $('ac-error');
  box.hidden = false;
  box.innerHTML = '<div class="pro-empty" style="margin-top:2rem" role="alert">' + ui.icon('error', { size: 32, stroke: 1.6 }) +
    '<div class="pro-empty__title">Chargement impossible</div><div class="pro-empty__text">' + esc(message) + '</div>' +
    '<button type="button" class="pro-btn pro-btn--secondary" id="ac-retry">Réessayer</button></div>';
  $('ac-retry').addEventListener('click', function () { window.location.reload(); });
}

charts.attachTooltips(document.body);

Promise.all([
  fetch('data/inventaire.json').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }),
  // Exemplaires créés via exemplarisation.html (état partagé R2), fusionnés
  // pour que leur cote soit prise en compte dans l'analyse des trous/doublons
  // — voir js/exemplaires-manuels-shared.js.
  fetchExemplairesManuelsAsCatalogRows()
])
  .then(function (res) {
    buildCotesAnalysis(res[0].concat(res[1]));
    renderTabs();
    renderPanelShells();
    renderNext();
    $('ac-loading').hidden = true;
    $('ac-content').hidden = false;
    var head = $('ac-head');
    /* Le panneau ouvert est construit au moment de l'ouverture. */
    head.addEventListener('rp-tab-change', function (ev) { ensurePanel(ev.detail.id); });
    ui.tabs(head, { hashPrefix: 'serie-' });
  })
  .catch(function (err) {
    showError(err && err.message ? err.message : String(err));
  });
})();
</script>
