<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visiter la Réserve — Bibliothèques de Douai</title>
  <meta name="description" content="Promenez-vous dans la réserve patrimoniale des Bibliothèques de Douai. Parcourez les rayons, ouvrez les livres, feuilletez les pages numérisées.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/bibliotheque-virtuelle.css"/>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous">

</head>
<body>

  <!-- ════════════ EN-TÊTE ════════════ -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M15 18l-6-6 6-6"/></svg>
        Retour
      </a>
      <h1>Visiter la <em>Réserve</em></h1>
      <div class="search-wrap">
        <div class="search-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="search-input" type="text" placeholder="Chercher un titre, un auteur, une cote…" autocomplete="off">
        </div>
        <div class="search-results-dropdown" id="search-dropdown" role="listbox"></div>
      </div>
    </div>
  </header>

  <!-- ════════════ NAV TRAVÉES ════════════ -->
  <nav class="travee-nav" aria-label="Collections de la réserve">
    <div class="travee-nav-inner">
      <div class="travee-nav-label" id="travee-nav-label">Choisir une collection</div>
      <div class="travee-tabs" id="travee-tabs" role="tablist"></div>
    </div>
  </nav>

  <!-- ════════════ SCÈNE ════════════ -->
  <main>
    <div class="stage" id="stage">
      <div class="loader-state">
        <h2>Ouverture de la réserve</h2>
        <p>Récupération de l'inventaire…</p>
        <div class="loader-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </main>

  <!-- ════════════ MODALE LIVRE ════════════ -->
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-book">
      <div class="modal-bar">
        <div class="modal-bar-loc" id="modal-bar-loc"></div>
        <button class="modal-close" id="modal-close" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Fermer
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-info" id="modal-info"></div>
        <div class="modal-cover" id="modal-cover"></div>
      </div>
    </div>
  </div>

  <!-- Tooltip livre -->
  <div class="book-tooltip" id="book-tooltip" role="tooltip"></div>

  <!-- ════════════ SCRIPT ════════════ -->
  <script src="js/bibliotheque-virtuelle.js"></script>
</body>
</html>
